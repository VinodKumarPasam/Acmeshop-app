services:

  postgres:
    image: postgres:17
    #container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - acmeshop-network

  user-service:
    build:
      context: ./acmeshop-user-service
      dockerfile: Dockerfile

    #container_name: user-service
    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - ./acmeshop-user-service/.env

    ports:
      - "3000:3000"

    networks:
      - acmeshop-network

  product-service:
    build:
      context: ./acmeshop-product-service
      dockerfile: Dockerfile

    #container_name: product-service
    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - ./acmeshop-product-service/.env

    ports:
      - "3001:3001"

    networks:
      - acmeshop-network

  cart-service:
    build:
      context: ./acmeshop-cart-service
      dockerfile: Dockerfile

    #container_name: cart-service
    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - ./acmeshop-cart-service/.env

    ports:
      - "3002:3002"

    networks:
      - acmeshop-network

  order-service:
    build:
      context: ./acmeshop-order-service
      dockerfile: Dockerfile

    #container_name: order-service
    restart: unless-stopped

    depends_on:
      - postgres

    env_file:
      - ./acmeshop-order-service/.env

    ports:
      - "3003:3003"

    networks:
      - acmeshop-network

  frontend:
    build:
      context: ./acmeshop-frontend
      dockerfile: Dockerfile

    #container_name: frontend
    restart: unless-stopped

    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service

    ports:
      - "80:80"

    networks:
      - acmeshop-network

volumes:
  postgres-data:

networks:
  acmeshop-network:
    driver: bridge